services:

  filebrowser:
    image: gtstef/filebrowser:latest
    container_name: filebrowser
    ports:
      - "8900:80"
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./data:/home/filebrowser/data
      - ./files:/files
    environment:
      - FILEBROWSER_CONFIG=data/config.yaml
      - FILEBROWSER_DATABASE_PATH="data/filebrowser.sqlite"
      - TZ=Europe/Madrid
